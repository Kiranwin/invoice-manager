<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票夹子 — 智能发票管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top-nav">
    <div class="brand">发票<span>夹子</span></div>
    <nav>
      <a href="/scan"  class="{{ 'active' if page == 'scan' else '' }}">扫描发票</a>
      <a href="/list"  class="{{ 'active' if page == 'list' else '' }}">发票列表</a>
      <a href="/query" class="{{ 'active' if page == 'query' else '' }}">查询筛选</a>
      <a href="/tags" class="{{ 'active' if page == 'tags' else '' }}">标签管理</a>
      <a href="/match-amount" class="{{ 'active' if page == 'match_amount' else '' }}">智能凑票</a>
      <a href="/assignments" class="{{ 'active' if page == 'assignments' else '' }}">归属管理</a>
      <a href="/export" class="{{ 'active' if page == 'export' else '' }}">导出报销</a>
    </nav>
    <span class="nav-version">v3.3.2</span>
  </header>

  <main class="content">
    {% if message %}
    <div class="flash {{ msg_type }}">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
