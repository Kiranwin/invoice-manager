# ============================================================
# 发票夹子 v3.4.1 · 配置文件模板
# 使用前请复制为 config.yaml 并填写您的 API 密钥
# ============================================================

# 存储设置
storage:
  # 发票归档根目录（绝对路径或相对于用户目录的路径）
  base_dir: ~/invoice-manager

  # 可选：报销单文件导出目录；留空时使用 ~/Documents/发票夹子/exports
  # export_dir: ~/invoice-manager/exports

  # 数据库类型：sqlite | postgresql
  db_type: sqlite

  # SQLite 配置（db_type = sqlite 时使用）
  # 数据库文件路径
  db_path: ~/invoice-manager/invoices.db

  # PostgreSQL 配置（db_type = postgresql 时使用）
  # pg_host: localhost
  # pg_port: 5432
  # pg_database: invoice_manager
  # pg_user: postgres
  # pg_password: ""

# 监控目录（CLI scan 命令扫描的文件夹）
watch_dirs:
  - ~/invoice-manager/inbox
  # - /path/to/another/folder

# Web 服务配置
server:
  # 前端运行端口
  port: 8000
  # 绑定的主机地址
  host: "127.0.0.1"

# MCP Server 配置（AI Agent 调用接口）
mcp:
  # 传输模式: http (Streamable HTTP, 默认) | sse | stdio
  transport: http

# OCR 识别配置

ocr:
  # 第1级：本地 OCR（pdfplumber + PaddleOCR）
  text_ocr:
    enabled: false                     # 是否启用本地 OCR 引擎
    text_threshold: 100                # pdfplumber 提取字符数阈值，低于则启用 OCR
    ocr_fallback: true                 # 是否允许 OCR 回退
    pdf_dpi: 200                       # PDF 转图片 DPI
    poppler_path: null                 # Windows 需指定 poppler bin 路径，如 C:\poppler\bin

  # 第1级：百度智能云 OCR（增值税发票识别）
  baidu:
    enabled: true
    # 在 https://console.bce.baidu.com/ai/#/ai/ocr/overview 创建应用获取
    api_key: "xxxxxxxxxxxxxxxxx"
    secret_key: "xxxxxxxxxxxxxxxxxx"

  # 第2级：大模型视觉 API（OpenAI 兼容格式）
  llm:
    enabled: false
    # API 密钥（支持 DeepSeek、Qwen、OpenAI 等）
    api_key: "xxxxxxxxxxx"
    # API 基础 URL（根据服务商填写）
    base_url: "https://xxxxxxx/v1"
    # 模型名称（需支持视觉识别）
    model: "gpt-5-nano"
    # 请求超时（秒）
    timeout: 120
    # 识别提示词模板（可自定义，保留默认即可）
    prompt_template: |
      请识别这张发票图片，严格以 JSON 格式返回以下字段：
      {
        "invoice_number": "发票号码",
        "invoice_code": "发票代码",
        "invoice_date": "开票日期 YYYY-MM-DD",
        "commodity_name": "项目名称",
        "specification_model": "规格型号",
        "buyer_name": "购买方名称",
        "buyer_tax_num": "购买方纳税人识别号",
        "seller_name": "销售方名称",
        "seller_tax_num": "销售方纳税人识别号",
        "tax_rate": "税率（小数）",
        "tax_amount": "税额",
        "amount_with_tax": "价税合计",
        "category": "发票分类（餐饮/交通/办公/服务/其他）"
      }
      只返回 JSON，不要任何解释文字。
