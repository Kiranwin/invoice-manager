[project]
name = "invoice-manager"
version = "3.6.2"
description = "智能发票管理工具 — 自动识别、归档、导出报销单"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Invoice Manager Team" },
]
keywords = ["invoice", "发票", "OCR", "报销"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    # mcp 2.x 把 FastMCP 改名为 MCPServer、会话管理 API 也变了；本项目用的是 1.x
    # 接口，先钉住上限，等迁移后再放开
    "mcp>=1.27.2,<2",
    "openpyxl>=3.1.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
invoice-manager-web = "invoice_clipper.__main__:web_main"

[project.optional-dependencies]
# OFD 电子发票格式支持（Python 3.14+ 兼容）
ofd = [
    "easyofd>=0.0.9",
]
# 本地离线 OCR（PaddleOCR）
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
]
# 完整安装（全部组件）
full = [
    "invoice-manager[ofd,ocr]",
]
# 开发工具
dev = [
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# 排除根级遗留文件（/ 前缀锚定到项目根目录）
exclude = [
    "/run.py",
    "/templates/",
    "/static/",
    "/config/",
]

[tool.hatch.build.targets.wheel]
packages = ["invoice_clipper"]
